<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="HassanEditz favicon">
  <defs>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="248" />
    </clipPath>
    <linearGradient id="ringGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="252" fill="#030712" />
  <circle cx="256" cy="256" r="244" fill="none" stroke="url(#ringGlow)" stroke-width="10" />
  <g clip-path="url(#circleClip)">
    <image href="/hassan.jpeg" x="0" y="0" width="512" height="512" preserveAspectRatio="xMidYMid slice" />
    <rect x="0" y="0" width="512" height="512" fill="rgba(3,7,18,0.18)" />
